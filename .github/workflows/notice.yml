name: Notice Eight Echo
# Une notice mise a jour dans docs/ est publiee dans la derniere Release (nom fixe EightEcho-Notice.pdf), sans recompiler.
on:
  push:
    branches: [ main ]
    paths: [ 'docs/**.pdf', '.github/workflows/notice.yml' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publier la notice
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(ls docs/*.pdf 2>/dev/null | grep -vi midi | sort -V | tail -1 || true)
          [ -z "$N" ] && exit 0
          TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          [ -z "$TAG" ] && exit 0
          cp "$N" EightEcho-Notice.pdf
          gh release upload "$TAG" EightEcho-Notice.pdf --clobber
